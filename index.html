<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユメタン1 クイズアプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ユメタン1 クイズアプリ</h1>
            <p>英単語の学習をクイズ形式で楽しもう！</p>
        </header>

        <!-- ユニット選択画面 -->
        <div id="unit-selection" class="screen">
            <h2>出題範囲を選択してください</h2>
            <div class="unit-grid">
                <div class="unit-item">
                    <input type="checkbox" id="unit1" value="1" checked>
                    <label for="unit1">Unit 1</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit2" value="2" checked>
                    <label for="unit2">Unit 2</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit3" value="3" checked>
                    <label for="unit3">Unit 3</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit4" value="4">
                    <label for="unit4">Unit 4</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit5" value="5">
                    <label for="unit5">Unit 5</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit6" value="6">
                    <label for="unit6">Unit 6</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit7" value="7">
                    <label for="unit7">Unit 7</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit8" value="8">
                    <label for="unit8">Unit 8</label>
                </div>
                <div class="unit-item">
                    <input type="checkbox" id="unit9" value="9">
                    <label for="unit9">Unit 9</label>
                </div>
            </div>
            <div class="quiz-type-selection">
                <h3>クイズタイプを選択:</h3>
                <div class="quiz-type-item">
                    <input type="radio" id="en-to-ja" name="quiz-type" value="en-to-ja" checked>
                    <label for="en-to-ja">英語→日本語（選択問題）</label>
                </div>
                <div class="quiz-type-item">
                    <input type="radio" id="ja-to-en" name="quiz-type" value="ja-to-en">
                    <label for="ja-to-en">日本語→英語（綴り問題）</label>
                </div>
            </div>
            <button id="start-quiz" class="btn-primary">クイズ開始</button>
        </div>

        <!-- 英語→日本語クイズ画面 -->
        <div id="en-to-ja-quiz" class="screen hidden">
            <div class="quiz-header">
                <span id="question-counter">問題 1 / 10</span>
                <span id="score">正解数: 0</span>
            </div>
            <div class="question-section">
                <h2 id="english-word">Loading...</h2>
                <div id="choices" class="choices-grid">
                    <!-- 選択肢がここに動的に追加される -->
                </div>
            </div>
            <button id="next-question" class="btn-primary hidden">次の問題</button>
            <button id="back-to-menu" class="btn-secondary hidden">メニューに戻る</button>
        </div>

        <!-- 日本語→英語クイズ画面 -->
        <div id="ja-to-en-quiz" class="screen hidden">
            <div class="quiz-header">
                <span id="spelling-question-counter">問題 1 / 10</span>
                <span id="spelling-score">正解数: 0</span>
            </div>
            <div class="question-section">
                <h2 id="japanese-word">Loading...</h2>
                <p class="instruction">英単語を入力してください:</p>
                <input type="text" id="spelling-input" placeholder="英単語を入力...">
                <button id="check-spelling" class="btn-primary">回答</button>
                <div id="spelling-feedback" class="feedback hidden"></div>
            </div>
            <button id="next-spelling-question" class="btn-primary hidden">次の問題</button>
            <button id="back-to-menu-spelling" class="btn-secondary hidden">メニューに戻る</button>
        </div>

        <!-- 結果画面 -->
        <div id="results" class="screen hidden">
            <h2>クイズ結果</h2>
            <div id="final-score"></div>
            <div id="performance-message"></div>
            <button id="restart-quiz" class="btn-primary">もう一度</button>
            <button id="back-to-menu-results" class="btn-secondary">メニューに戻る</button>
        </div>
    </div>

    <script src="vocabulary.js"></script>
    <script src="script.js"></script>
</body>
</html>
